<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発車案内 - パタパタ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .board-wrapper { width: 100%; max-width: 900px; }
  .board-title {
    background: #1a1a1a;
    border: 2px solid #444;
    border-bottom: none;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    letter-spacing: 4px;
    color: #aaa;
  }
  .board {
    background: #111;
    border: 3px solid #444;
    border-radius: 0 0 4px 4px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
  }
  .board-header {
    display: grid;
    grid-template-columns: 90px 1fr 130px 80px 70px;
    background: #222;
    border-bottom: 2px solid #555;
    padding: 6px 12px;
    font-size: 11px;
    color: #888;
    letter-spacing: 2px;
    gap: 8px;
  }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr 130px 80px 70px;
    border-bottom: 1px solid #2a2a2a;
    padding: 6px 12px;
    gap: 8px;
    align-items: center;
    min-height: 58px;
    transition: background 0.3s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255,255,255,0.03); }
  .row.departing { animation: flashRow 0.4s ease-in-out; }
  @keyframes flashRow {
    0%,100% { background: transparent; }
    50% { background: rgba(255,200,0,0.08); }
  }
  .cell-time { display: flex; align-items: center; gap: 3px; }
  .flap-group { display: inline-flex; gap: 2px; }
  .flap {
    width: 22px; height: 36px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .flap-top, .flap-bottom {
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #f0e68c;
    background: #1c1c1c;
    line-height: 1;
    overflow: hidden;
    text-shadow: 0 0 8px rgba(240,230,140,0.4);
  }
  .flap-top { border-bottom: 1px solid #000; align-items: flex-end; padding-bottom: 1px; }
  .flap-bottom { align-items: flex-start; padding-top: 1px; }
  .flap-separator {
    width: 22px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; color: #f0e68c;
  }
  @keyframes flipTop {
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }
  @keyframes flipBottom {
    0%   { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  .flap.flipping .flap-top    { animation: flipTop    0.15s ease-in  forwards; transform-origin: bottom center; }
  .flap.flipping .flap-bottom { animation: flipBottom 0.15s ease-out 0.15s forwards; transform-origin: top center; }
  .cell-dest { display: flex; flex-direction: column; gap: 3px; }
  .dest-main {
    font-size: 22px; font-weight: bold; color: #fff;
    letter-spacing: 2px; display: flex; gap: 6px;
    align-items: center; overflow: hidden; white-space: nowrap;
  }
  .dest-via { font-size: 10px; color: #888; letter-spacing: 1px; }
  .cell-train { display: flex; flex-direction: column; gap: 3px; }
  .train-badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-size: 13px; font-weight: bold; letter-spacing: 1px; text-align: center;
  }
  .train-number { font-size: 10px; color: #777; letter-spacing: 1px; }
  .cell-track { text-align: center; }
  .track-num { font-size: 28px; font-weight: bold; color: #fff; line-height: 1; }
  .track-label { font-size: 9px; color: #666; letter-spacing: 2px; }
  .cell-status { text-align: center; }
  .status-badge {
    display: inline-block; padding: 3px 6px; border-radius: 2px;
    font-size: 11px; font-weight: bold; letter-spacing: 1px; text-align: center;
  }
  .status-ontime   { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
  .status-delayed  { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }
  .status-boarding { background: #3a2800; color: #ff9800; border: 1px solid #ff9800; animation: blink 1s infinite; }
  .status-depart   { background: #0a1a3a; color: #2196f3; border: 1px solid #2196f3; animation: blink 0.5s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .type-nozomi  { background: #c62828; color: #fff; }
  .type-hikari  { background: #e65100; color: #fff; }
  .type-kodama  { background: #1565c0; color: #fff; }
  .type-mizuho  { background: #6a1b9a; color: #fff; }
  .type-sakura  { background: #ad1457; color: #fff; }
  .type-tsubame { background: #2e7d32; color: #fff; }
  .type-kamome  { background: #00838f; color: #fff; }
  .clock-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding: 8px 16px;
    background: #111; border: 1px solid #333; border-radius: 4px;
    font-size: 12px; color: #666;
  }
  #clock {
    font-size: 28px; color: #f0e68c; font-weight: bold;
    letter-spacing: 4px; text-shadow: 0 0 10px rgba(240,230,140,0.5);
    font-family: 'Courier New', monospace;
  }
  .station-name { font-size: 14px; letter-spacing: 3px; color: #aaa; }
  .scroll-notice {
    overflow: hidden; white-space: nowrap;
    color: #555; font-size: 11px; flex: 1; margin: 0 20px;
  }
  .scroll-inner { display: inline-block; animation: marquee 30s linear infinite; }
  @keyframes marquee {
    0%   { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
  .led-strip {
    height: 3px;
    background: linear-gradient(90deg, #f0e68c33, #f0e68c88, #f0e68c33);
    margin-bottom: 2px; border-radius: 1px;
  }
</style>
</head>
<body>
<div class="board-wrapper">
  <div class="board-title">■ 発 車 案 内 ■　DEPARTURE INFORMATION</div>
  <div class="led-strip"></div>
  <div class="board">
    <div class="board-header">
      <div>発車時刻</div><div>行　き　先</div><div>列 車 名</div><div>番線</div><div>状　態</div>
    </div>
    <div id="rows-container"></div>
  </div>
  <div class="clock-bar">
    <div class="station-name">● 東　京</div>
    <div class="scroll-notice">
      <span class="scroll-inner">
        ただいま新幹線は定刻通り運行しております。ホームドアにご注意ください。乗り越し等にはご注意ください。
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        Shinkansen services are operating on schedule. Please be careful of platform screen doors.
      </span>
    </div>
    <div id="clock">--:--:--</div>
  </div>
</div>
<script>
const TRAINS = [
  { type:'nozomi',  label:'のぞみ', number:'501号', dest:'博多',      via:'新大阪・広島経由', track:14, delay:0 },
  { type:'hikari',  label:'ひかり', number:'505号', dest:'新大阪',    via:'静岡・名古屋経由', track:15, delay:0 },
  { type:'mizuho',  label:'みずほ', number:'601号', dest:'鹿児島中央',via:'新大阪・熊本経由', track:14, delay:0 },
  { type:'kodama',  label:'こだま', number:'731号', dest:'三島',      via:'品川・新横浜経由', track:19, delay:3 },
  { type:'nozomi',  label:'のぞみ', number:'3号',   dest:'博多',      via:'名古屋・京都経由', track:16, delay:0 },
  { type:'sakura',  label:'さくら', number:'551号', dest:'鹿児島中央',via:'新神戸・広島経由', track:14, delay:0 },
  { type:'hikari',  label:'ひかり', number:'509号', dest:'岡山',      via:'小田原・静岡経由', track:17, delay:0 },
  { type:'tsubame', label:'つばめ', number:'303号', dest:'熊本',      via:'博多経由',         track:14, delay:0 },
  { type:'nozomi',  label:'のぞみ', number:'21号',  dest:'新大阪',    via:'品川・名古屋経由', track:18, delay:0 },
  { type:'kamome',  label:'かもめ', number:'3号',   dest:'長崎',      via:'博多・佐賀経由',   track:14, delay:5 },
];
let schedule = [];
function initSchedule() {
  const base = new Date(); base.setSeconds(0,0);
  schedule = TRAINS.map((t,i) => {
    const dep = new Date(base);
    dep.setMinutes(dep.getMinutes() + 1 + i*3 + Math.floor(Math.random()*2));
    return {...t, depTime: dep, id: i};
  });
  schedule.sort((a,b) => a.depTime - b.depTime);
}
function pad2(n) { return String(n).padStart(2,'0'); }
function getStatus(dep, delay) {
  const diff = (dep - new Date()) / 60000;
  if (delay > 0) return { label:`${delay}分遅延`, cls:'status-delayed' };
  if (diff <= 0)  return { label:'発　車', cls:'status-depart' };
  if (diff <= 2)  return { label:'乗車中', cls:'status-boarding' };
  return { label:'定　刻', cls:'status-ontime' };
}
function flapChar(ch, gid, idx) {
  return `<div class="flap" id="f-${gid}-${idx}"><div class="flap-top">${ch}</div><div class="flap-bottom">${ch}</div></div>`;
}
function buildRow(t, ri) {
  const hh = pad2(t.depTime.getHours()), mm = pad2(t.depTime.getMinutes());
  const st = getStatus(t.depTime, t.delay);
  const time =
    `<div class="flap-group" id="gh-${ri}">${[...hh].map((c,i)=>flapChar(c,`h${ri}`,i)).join('')}</div>` +
    `<div class="flap-separator">:</div>` +
    `<div class="flap-group" id="gm-${ri}">${[...mm].map((c,i)=>flapChar(c,`m${ri}`,i)).join('')}</div>`;
  return `<div class="row" id="row-${ri}">
    <div class="cell-time">${time}</div>
    <div class="cell-dest">
      <div class="dest-main"><span>${t.dest}</span><span style="font-size:13px;color:#aaa;">行</span></div>
      <div class="dest-via">${t.via}</div>
    </div>
    <div class="cell-train">
      <div><span class="train-badge type-${t.type}">${t.label}</span></div>
      <div class="train-number">${t.number}</div>
    </div>
    <div class="cell-track"><div class="track-num">${t.track}</div><div class="track-label">番線</div></div>
    <div class="cell-status"><div class="status-badge ${st.cls}" id="st-${ri}">${st.label}</div></div>
  </div>`;
}
function flipChar(el, ch, delay) {
  return new Promise(r => setTimeout(() => {
    el.classList.add('flipping');
    el.querySelector('.flap-bottom').textContent = ch;
    setTimeout(() => { el.querySelector('.flap-top').textContent = ch; el.classList.remove('flipping'); r(); }, 320);
  }, delay));
}
async function updateGroup(gid, str) {
  const g = document.getElementById(gid); if (!g) return;
  const flaps = g.querySelectorAll('.flap');
  await Promise.all([...flaps].map((f,i) => {
    const t = str[i]||' ';
    return f.querySelector('.flap-top').textContent !== t ? flipChar(f, t, i*80) : Promise.resolve();
  }));
}
function render() {
  document.getElementById('rows-container').innerHTML = schedule.map((t,i)=>buildRow(t,i)).join('');
}
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent = `${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`;
}
let lastMin = -1;
function tick() {
  const now = new Date(); updateClock();
  if (now.getMinutes() === lastMin) return;
  lastMin = now.getMinutes();
  schedule.forEach((t,i) => {
    updateGroup(`gh-${i}`, pad2(t.depTime.getHours()));
    updateGroup(`gm-${i}`, pad2(t.depTime.getMinutes()));
    const st = getStatus(t.depTime, t.delay);
    const el = document.getElementById(`st-${i}`);
    if (el) { el.textContent = st.label; el.className = `status-badge ${st.cls}`; }
    const diff = (t.depTime - now) / 60000;
    if (diff <= 0 && diff > -1) {
      const row = document.getElementById(`row-${i}`);
      if (row) { row.classList.add('departing'); setTimeout(()=>row.classList.remove('departing'),2000); }
    }
  });
  schedule.filter(t=>(t.depTime-now)/60000<-2).forEach(t=>{
    const d=new Date(t.depTime);
    d.setMinutes(d.getMinutes()+TRAINS.length*3+Math.floor(Math.random()*5));
    t.depTime=d; t.delay=Math.random()<0.1?Math.floor(Math.random()*8+1):0;
  });
  schedule.sort((a,b)=>a.depTime-b.depTime); render();
}
initSchedule(); render(); updateClock(); setInterval(tick, 1000);
setTimeout(()=>schedule.forEach((t,i)=>setTimeout(()=>{
  updateGroup(`gh-${i}`,pad2(t.depTime.getHours()));
  updateGroup(`gm-${i}`,pad2(t.depTime.getMinutes()));
},i*200)),300);
</script>
</body>
</html>
